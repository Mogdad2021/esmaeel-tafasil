<!DOCTYPE html>
<html lang="ar" dir="rtl">

<title>تفاصيل التحاويل الخاصه بـ خ اسماعيل - إدارة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --bg: #F8FAFC; --card: #FFFFFF; --text: #1E293B; --muted: #64748B; --border: #E2E8F0;
    --gold: #B45309; --green: #15803D; --red: #B91C1C; --accent: #1E3A8A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Tajawal', Tahoma, Arial, sans-serif; background: var(--bg); color: var(--text);
    padding: calc(12px + env(safe-area-inset-top, 0px)) 12px calc(24px + env(safe-area-inset-bottom, 0px));
    font-size: 16px;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 12px; color: var(--accent); }
  h2 { font-size: 16px; margin: 0 0 10px; color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; }
  @media (min-width: 720px) { .kpis { grid-template-columns: repeat(4, 1fr); } }
  .kpi { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
  .kpi .label { font-size: 13px; color: var(--muted); }
  .kpi .val { font-size: 20px; font-weight: 700; margin-top: 4px; word-break: break-all; }
  .gold { color: var(--gold); } .green { color: var(--green); } .red { color: var(--red); }
  .form-grid { display: grid; gap: 10px; }
  @media (min-width: 720px) { .form-grid { grid-template-columns: repeat(3, 1fr); } }
  .settings-row { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input, select {
    width: 100%; font: inherit; font-size: 16px; padding: 10px; border: 1px solid var(--border);
    border-radius: 8px; background: #fff; color: var(--text);
  }
  .check { display: flex; align-items: center; gap: 8px; padding-top: 22px; }
  .check input { width: 20px; height: 20px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  button { font: inherit; font-size: 16px; padding: 10px 16px; border-radius: 8px; border: none; cursor: pointer; background: var(--accent); color: #fff; }
  button.secondary { background: #E2E8F0; color: var(--text); }
  button.danger { background: #FEE2E2; color: var(--red); padding: 6px 10px; font-size: 14px; }
  button.edit { background: #EFF6FF; color: var(--accent); padding: 6px 10px; font-size: 14px; }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .entry { border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 8px; display: grid; gap: 6px; }
  .entry .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #EFF6FF; color: var(--accent); }
  .tag.transfer { background: #FFF7ED; color: var(--gold); }
  .tag.bank { background: #F0FDF4; color: var(--green); }
  .meta { font-size: 14px; color: var(--muted); }
  .ded { font-size: 12px; color: var(--red); }
  .filter { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .filter input { flex: 1; min-width: 160px; }
  .empty { text-align: center; color: var(--muted); padding: 20px 0; }
  .status { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .hidden { display: none !important; }
</style>
</head>

<div class="wrap">
  <h1>تفاصيل التحاويل الخاصه بـ خ اسماعيل - إدارة</h1>

  <!-- Login -->
  <div class="card" id="loginCard">
    <h2>تسجيل الدخول</h2>
    <div class="form-grid" style="grid-template-columns:1fr">
      <div><label for="email">البريد الإلكتروني</label><input type="email" id="email" autocomplete="username"></div>
      <div><label for="password">كلمة السر</label><input type="password" id="password" autocomplete="current-password"></div>
    </div>
    <div class="actions"><button id="loginBtn">دخول</button></div>
    <div class="status" id="loginStatus"></div>
  </div>

  <!-- App -->
  <div id="app" class="hidden">
    <div class="actions" style="margin:0 0 12px">
      <button class="secondary" id="logoutBtn">خروج</button>
      <button class="hidden" id="importBtn">استيراد بيانات الإكسل (مرة واحدة)</button>
    </div>

    <div class="kpis">
      <div class="kpi"><div class="label">إجمالي الريال</div><div class="val gold" id="kTotalSar">0</div></div>
      <div class="kpi"><div class="label">إجمالي السوداني (صرف)</div><div class="val green" id="kTotalSdg">0</div></div>
      <div class="kpi"><div class="label">تحويلات بنكك</div><div class="val green" id="kBank">0</div></div>
      <div class="kpi"><div class="label">تحويلات الريال</div><div class="val gold" id="kSarTr">0</div></div>
      <div class="kpi"><div class="label">الريال المتبقي</div><div class="val gold" id="kRemSar">0</div></div>
      <div class="kpi"><div class="label">عمولات البنك</div><div class="val red" id="kComm">0</div></div>
      <div class="kpi"><div class="label">الجنيه المتبقي</div><div class="val green" id="kRemSdg">0</div></div>
    </div>

    <div class="card">
      <h2>الإعدادات</h2>
      <div class="settings-row">
        <div>
          <label for="defaultRate">سعر اليوم (الافتراضي)</label>
          <input type="number" id="defaultRate" inputmode="decimal" placeholder="اكتب السعر">
          <div class="hint">أي صرف ما لوش سعر خاص بياخد السعر ده.</div>
        </div>
        <div>
          <label for="commFixed">العمولة الثابتة</label>
          <input type="number" id="commFixed" inputmode="decimal">
        </div>
      </div>
      <div class="settings-row" style="margin-top:10px">
        <div>
          <label for="commPer">عمولة لكل صرف</label>
          <input type="number" id="commPer" inputmode="decimal">
        </div>
        <div>
          <label for="commFrom">تبدأ العمولة من تاريخ</label>
          <input type="date" id="commFrom">
        </div>
      </div>
    </div>

    <div class="card">
      <h2 id="formTitle">إضافة حركة</h2>
      <div class="form-grid">
        <div>
          <label for="type">النوع</label>
          <select id="type">
            <option value="exchange">صرف (ريال ← سوداني)</option>
            <option value="sarTransfer">تحويل ريال</option>
            <option value="bank">تحويل بنكك (سوداني)</option>
          </select>
        </div>
        <div><label for="date">التاريخ</label><input type="date" id="date"></div>
        <div><label for="amount" id="amountLabel">المبلغ بالريال</label><input type="number" id="amount" inputmode="decimal"></div>
        <div id="rateWrap">
          <label for="rate">سعر التحويل (اختياري)</label>
          <input type="number" id="rate" inputmode="decimal" placeholder="يأخذ سعر اليوم">
        </div>
        <div>
          <label for="details">التفاصيل</label>
          <input type="text" id="details" list="names" placeholder="مثال: مع نزار خالد">
          <datalist id="names"></datalist>
        </div>
        <div class="check" id="dedWrap">
          <input type="checkbox" id="deducted">
          <label for="deducted" style="margin:0;color:var(--text)">مخصوم</label>
        </div>
      </div>
      <div class="hint" id="preview"></div>
      <div class="actions">
        <button id="saveBtn">إضافة</button>
        <button class="secondary hidden" id="cancelBtn">إلغاء التعديل</button>
      </div>
    </div>

    <div class="card">
      <h2>الحركات</h2>
      <div class="filter">
        <input type="text" id="search" placeholder="بحث بالتفاصيل أو المبلغ">
        <select id="filterType" style="max-width:200px">
          <option value="all">الكل</option>
          <option value="exchange">صرف</option>
          <option value="sarTransfer">تحويل ريال</option>
          <option value="bank">تحويل بنكك</option>
        </select>
      </div>
      <div id="list"></div>
    </div>
  </div>
</div>

  function sdgOf(e) {

    return (e.type !== 'exchange' || r == null) ? null : Number(e.amount) * r;

  function computeTotals() {
    const ex = entries.filter(e => e.type === 'exchange');
    const sarTr = entries.filter(e => e.type === 'sarTransfer');

    return {
      totalSar, totalSdg, bankTotal, sarTrTotal, comm,
      remSar: totalSar - sarTrDed,
      remSdg: bankTotal - totalSdg - comm

      const date = document.createElement('span'); date.className = 'meta'; date.textContent = e.date || '';

        const r = effectiveRate(e), s = sdgOf(e);

  function updateFormForType() {
    const t = $('type').value;
    $('amountLabel').textContent = t === 'bank' ? 'المبلغ بالسوداني' : 'المبلغ بالريال';
    $('rateWrap').style.display = t === 'exchange' ? '' : 'none';
    $('dedWrap').style.display = t === 'bank' ? 'none' : '';
    updatePreview();
  }

  function updatePreview() {
    const t = $('type').value, amt = Number($('amount').value);
    if (t !== 'exchange' || !amt) { $('preview').textContent = ''; return; }
    const r = $('rate').value !== '' ? Number($('rate').value) : (settings.defaultRate !== '' ? Number(settings.defaultRate) : null);
    $('preview').textContent = r == null ? 'اكتب سعر الصرف أو سعر اليوم' : 'المبلغ بالسوداني: ' + fmt(amt * r);
  }

  function resetForm() {
    editingId = null;
    $('formTitle').textContent = 'إضافة حركة';
    $('saveBtn').textContent = 'إضافة';
    $('cancelBtn').classList.add('hidden');
    $('amount').value = ''; $('rate').value = ''; $('details').value = '';
    $('deducted').checked = false; $('date').value = today();
    updatePreview();
  }

  function startEdit(e) {
    editingId = e.id;
    $('formTitle').textContent = 'تعديل حركة';
    $('saveBtn').textContent = 'حفظ التعديل';
    $('cancelBtn').classList.remove('hidden');
    $('type').value = e.type;
    $('date').value = e.date || today();
    $('amount').value = e.amount;
    $('rate').value = e.rate === '' || e.rate == null ? '' : e.rate;
    $('details').value = e.details || '';
    $('deducted').checked = !!e.deducted;
    updateFormForType();
    window.scrollTo({ top: $('formTitle').offsetTop - 10, behavior: 'smooth' });
  }

  function saveEntry() {
    const type = $('type').value;
    const amount = Number($('amount').value);
    if (!amount || amount <= 0) { alert('اكتب المبلغ'); return; }
    const rate = type === 'exchange' && $('rate').value !== '' ? Number($('rate').value) : '';
    if (type === 'exchange' && rate === '' && (settings.defaultRate === '' || settings.defaultRate == null)) {
      alert('اكتب سعر الصرف أو سعر اليوم'); return;
    }
    const obj = {
      type, amount, rate,
      date: $('date').value || today(),
      details: $('details').value.trim(),
      deducted: type === 'bank' ? false : $('deducted').checked
    };
    if (editingId) {
      db.ref('ledger/' + editingId).update(obj).then(resetForm);
    } else {
      obj.createdAt = firebase.database.ServerValue.TIMESTAMP;
      db.ref('ledger').push(obj).then(resetForm);
    }
  }

  function writeSettings() {
    const s = {
      defaultRate: $('defaultRate').value,
      commFixed: Number($('commFixed').value || 0),
      commPer: Number($('commPer').value || 0),
      commFrom: $('commFrom').value || '2026-09-06'
    };
    db.ref('settings').set(s);
  }

  function bind() {
    $('type').addEventListener('change', updateFormForType);
    $('amount').addEventListener('input', updatePreview);
    $('rate').addEventListener('input', updatePreview);
    $('saveBtn').addEventListener('click', saveEntry);
    $('cancelBtn').addEventListener('click', resetForm);
    $('search').addEventListener('input', renderList);
    $('filterType').addEventListener('change', renderList);
    ['defaultRate', 'commFixed', 'commPer', 'commFrom'].forEach(id => $(id).addEventListener('input', writeSettings));
    $('logoutBtn').addEventListener('click', () => auth.signOut());
    $('importBtn').addEventListener('click', importSeed);
    $('loginBtn').addEventListener('click', login);
    $('password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  }

  function login() {
    $('loginStatus').textContent = 'جاري الدخول...';
    auth.signInWithEmailAndPassword($('email').value.trim(), $('password').value)
      .catch(() => { $('loginStatus').textContent = 'البريد أو كلمة السر غلط'; });
  }

  function importSeed() {
    if (!confirm('هيتم إضافة ' + SEED.length + ' حركة من الإكسل. متعملش ده مرتين. تكمل؟')) return;
    const ref = db.ref('ledger');
    const updates = {};
    SEED.forEach((row, i) => {
      const key = ref.push().key;
      updates[key] = { ...row, createdAt: 1000 + i };
    });
    ref.update(updates).then(() => alert('تم الاستيراد')).catch(err => alert('فشل: ' + err.message));
  }

  function startData() {
    db.ref('ledger').on('value', snap => {
      const v = snap.val() || {};
      entries = Object.entries(v).map(([id, x]) => ({ id, ...x }));
      $('importBtn').classList.toggle('hidden', entries.length > 0);
      renderKpis(); renderList(); renderNames();
    });
    db.ref('settings').on('value', snap => {
      settings = { defaultRate: '', commFixed: 4260, commPer: 110, commFrom: '2026-09-06', ...(snap.val() || {}) };
      if (document.activeElement !== $('defaultRate')) $('defaultRate').value = settings.defaultRate ?? '';
      if (document.activeElement !== $('commFixed')) $('commFixed').value = settings.commFixed ?? 4260;
      if (document.activeElement !== $('commPer')) $('commPer').value = settings.commPer ?? 110;
      $('commFrom').value = settings.commFrom || '2026-09-06';
      renderKpis(); updatePreview();
    });
  }

  auth.onAuthStateChanged(user => {
    if (user) {
      $('loginCard').classList.add('hidden');
      $('app').classList.remove('hidden');
      $('date').value = today();
      startData();
    } else {
      $('loginCard').classList.remove('hidden');
      $('app').classList.add('hidden');
      $('loginStatus').textContent = '';
    }
  });

  bind();
  updateFormForType();
})();
</script>
</body>
</html>
