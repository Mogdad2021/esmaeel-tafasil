  input:focus, select:focus { border-color: rgba(196,238,43,.6); }
  .hint { font-size: 14px; color: var(--muted); margin-top: 10px; min-height: 18px; }

  /* ---------- login ---------- */
  .login-wrap { min-height: calc(100vh - 80px); display: grid; place-items: center; }
  .login-card { width: min(420px, 100%); background: var(--card); border: 1px solid var(--edge); border-radius: 24px; padding: 32px; }
  .login-card h2 { font-size: 22px; font-weight: 700; margin-bottom: 20px; }
  .login-card .field + .field { margin-top: 14px; }
  .login-card .btn-primary { width: 100%; margin-top: 20px; }
  .status { font-size: 14px; color: var(--muted); margin-top: 12px; min-height: 18px; }

  /* ---------- header ---------- */
  header.top { display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap; margin-bottom: 30px; }
  .brand { display: flex; align-items: center; gap: 18px; min-width: 0; }
  .mark { width: 60px; height: 60px; border-radius: 18px; background: var(--lime); color: #0F2009;
    display: grid; place-items: center; font-size: 30px; font-weight: 700; flex: none; }
  h1 { font-size: 30px; font-weight: 700; }
  .sub { font-size: 18px; color: var(--muted); margin-top: 4px; }
  .top-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  /* ---------- cards ---------- */
  .card { background: var(--card); border: 1px solid var(--edge); border-radius: 24px; min-width: 0; }
  .pad { padding: 28px; }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .card h2 { font-size: 20px; font-weight: 700; }
  .sub-sm { margin-top: 4px; color: var(--muted); font-size: 14px; }
  .badge { font-size: 13px; padding: 5px 12px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
  .badge.ok { background: rgba(196,238,43,.14); color: var(--lime); }
  .badge.saved { opacity: 0; transition: opacity .3s; }
  .badge.saved.on { opacity: 1; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid2 .field { min-width: 0; }
  .mt { margin-top: 18px; }
  .note-box { margin-top: 18px; background: var(--field); border: 1px solid var(--edge); border-radius: 14px; padding: 14px 16px; font-size: 14px; color: var(--muted); }
  .actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .actions .btn-primary { flex: 1; }
  .check-row { display: flex; align-items: center; gap: 10px; margin-top: 18px; }
  .check-row input { width: 18px; height: 18px; accent-color: var(--lime); }
  .check-row label { margin: 0; color: var(--text); font-size: 15px; }

  /* segmented control */
  .seg { display: inline-flex; background: rgba(255,255,255,.05); border: 1px solid var(--edge); border-radius: 14px; padding: 4px; gap: 4px; flex-wrap: wrap; }
  .seg button { background: transparent; color: var(--muted); min-height: 38px; padding: 8px 14px; font-size: 14px; font-weight: 600; border-radius: 10px; }
  .seg button:hover { color: var(--text); }
  .seg button.on { background: var(--lime-soft); color: var(--lime); }

  /* ---------- operations list (same design as the display page) ---------- */
  .list-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding: 28px 28px 8px; }
  .list-head h2 { font-size: 24px; font-weight: 700; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .controls input { width: 240px; height: 44px; }
  .list-wrap { padding: 0 28px 24px; }
  .item { display: flex; flex-direction: column; align-items: stretch; gap: 14px; padding: 22px 0; border-top: 1px solid var(--edge); }
  .item:first-child { border-top: 0; }
  .item-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .end-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .kind { font-size: 16px; padding: 4px 12px; border-radius: 999px; background: rgba(196,238,43,.14); color: var(--lime); white-space: nowrap; }
  .kind.transfer { background: rgba(232,199,106,.14); color: var(--gold); }
  .kind.bank { background: rgba(196,238,43,.14); color: var(--lime); }
  .when { font-size: 18px; color: var(--muted); }
  .status { font-size: 14px; padding: 4px 12px; border-radius: 999px; font-weight: 600; white-space: nowrap; min-height: 0; margin: 0; }
  .status.ok { background: rgba(196,238,43,.14); color: var(--lime); }
  .status.warn { background: rgba(232,199,106,.16); color: var(--gold); }
  .details { font-size: 20px; color: var(--text); line-height: 1.5; overflow-wrap: anywhere; }
  .big-amt { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .big-amt .v { font-size: clamp(40px, 4.4vw, 56px); font-weight: 700; line-height: 1.05; }
  .big-amt .v.sar { color: var(--gold); }
  .big-amt .v.sdg { color: var(--lime); }
  .big-amt .u { font-size: 20px; color: var(--muted); }
  .amt-box { background: rgba(255,255,255,.035); border: 1px solid var(--edge); border-radius: 16px; padding: 16px 20px; display: grid; gap: 10px; }
  .cl { display: grid; grid-template-columns: 28px 1fr; align-items: center; gap: 10px; font-size: 20px; }
  .cl .sym { color: var(--muted); font-weight: 700; text-align: center; font-size: 22px; }
  .cl .content { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0; }
  .cl .v { font-size: 26px; font-weight: 700; }
  .cl .v.sar { color: var(--gold); }
  .cl .v.sdg { color: var(--lime); }
  .cl .v.mid { color: var(--text); font-size: 22px; }

    <button class="btn-primary" id="loginBtn">دخول</button>
    <div class="status" id="loginStatus"></div>
  </div>
</div>

    <!-- settings + form -->
    <section class="two">
      <div class="card pad" id="settingsCard">

      <div class="card pad" id="formCard">

            <p class="sub-sm">سجّل صرفاً أو تحويلاً جديداً</p>
          </div>
        </div>
        <div class="seg mt" role="group" aria-label="نوع الحركة">
          <button type="button" data-type="exchange" class="on">صرف</button>
          <button type="button" data-type="sarTransfer">تحويل ريال</button>
          <button type="button" data-type="bank">تحويل بنكك</button>
        </div>
        <select id="type" class="hidden" aria-hidden="true">
          <option value="exchange">صرف (ريال ← سوداني)</option>
          <option value="sarTransfer">تحويل ريال</option>
          <option value="bank">تحويل بنكك (سوداني)</option>
        </select>
        <div class="grid2 mt">
          <div class="field"><label for="date">التاريخ</label><input type="date" id="date"></div>

        <div class="check-row" id="dedWrap">

          <label for="deducted">مخصوم</label>
        </div>
        <div class="hint" id="preview"></div>
        <div class="actions">
          <button class="btn-primary" id="saveBtn">إضافة الحركة</button>
          <button class="btn-ghost hidden" id="cancelBtn">إلغاء التعديل</button>
        </div>
      </div>
    </section>

    <!-- operations -->
    <section class="card" id="ledgerCard">
      <div class="list-head">
        <div>
          <h2>الحركات</h2>
          <p class="sub-sm">عدد الحركات: <span class="num counter" id="ledgerCount">0</span></p>
        </div>
        <div class="controls">

          <div class="seg" role="group" aria-label="فلترة الحركات">
            <button type="button" class="on" data-mode="all">الكل</button>
            <button type="button" data-mode="exchange">صرف</button>
            <button type="button" data-mode="sarTransfer">تحويل ريال</button>
            <button type="button" data-mode="bank">تحويل بنكك</button>
            <button type="button" data-mode="deducted">مخصوم</button>
          </div>
        </div>
      </div>
      <div class="list-wrap" id="list"></div>
    </section>
  </div>
</div>

(function () {
  let entries = [];
  let settings = { defaultRate: '', commFixed: 4260, commPer: 110, commFrom: '2026-09-06' };

  const $ = (id) => document.getElementById(id);
  const fmt = (n) => Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 });
  const today = () => {

    if (text != null) n.textContent = text;

  };

  // ===== formulas (unchanged from the original system) =====
  function effectiveRate(e) {
    if (e.rate !== '' && e.rate != null) return Number(e.rate);
    if (settings.defaultRate !== '' && settings.defaultRate != null) return Number(settings.defaultRate);
    return null;
  }
  function sdgOf(e) {
    const r = effectiveRate(e);
    return (e.type !== 'exchange' || r == null) ? null : Number(e.amount) * r;
  }
  function computeTotals() {
    const ex = entries.filter(e => e.type === 'exchange');
    const sarTr = entries.filter(e => e.type === 'sarTransfer');
    const bank = entries.filter(e => e.type === 'bank');
    const totalSar = ex.reduce((s, e) => s + Number(e.amount || 0), 0);
    const totalSdg = ex.reduce((s, e) => s + (sdgOf(e) || 0), 0);
    const bankTotal = bank.reduce((s, e) => s + Number(e.amount || 0), 0);
    const sarTrTotal = sarTr.reduce((s, e) => s + Number(e.amount || 0), 0);
    const sarTrDed = sarTr.filter(e => e.deducted).reduce((s, e) => s + Number(e.amount || 0), 0);
    const cnt = ex.filter(e => (e.date || '') >= (settings.commFrom || '0000-00-00')).length;
    const comm = Number(settings.commFixed || 0) + cnt * Number(settings.commPer || 0);
    return {
      totalSar, totalSdg, bankTotal, sarTrTotal, comm,
      remSar: totalSar - sarTrDed,
      remSdg: bankTotal - totalSdg - comm
    };
  }

  // ===== operation cards (same layout as the display page) =====
  const vEl = (text, cls) => el('span', 'v num ' + (cls || ''), text);
  const uEl = (text) => el('span', 'u', text);
  function calcLine(cls, sym, parts) {
    const row = el('div', 'cl ' + (cls || ''));
    row.appendChild(el('span', 'sym', sym || ''));
    const content = el('div', 'content');
    parts.forEach(p => content.appendChild(p));
    row.appendChild(content);
    return row;
  }
  function buildBody(e) {
    if (e.type === 'sarTransfer') {
      const wrap = el('div', 'big-amt');

      return wrap;

    if (e.type === 'bank') {
      const wrap = el('div', 'big-amt');
      wrap.append(vEl(fmt(e.amount), 'sdg'), uEl('جنيه سوداني'));

    } else {
      box.appendChild(calcLine('mid', '×', [uEl('بسعر اليوم')]));
    }

  }

  function visibleItems() {
    const q = $('search').value.trim().toLowerCase();

      .filter(e => filterMode === 'all' || (filterMode === 'deducted' ? !!e.deducted : e.type === filterMode))
      .filter(e => !q || (e.details || '').toLowerCase().includes(q) || String(e.amount).includes(q))
      .sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || 0) - (a.createdAt || 0));
  }

  function renderList() {

    $('amount').value = ''; $('rate').value = ''; $('details').value = '';

    updatePreview();

  function startEdit(e) {
    editingId = e.id;
    $('formTitle').textContent = 'تعديل حركة';

    $('date').value = e.date || today();

    $('formCard').scrollIntoView({ behavior: 'smooth', block: 'start' });

  function saveEntry() {
    const type = $('type').value;

    if (!amount || amount <= 0) { alert('اكتب المبلغ'); return; }
    const rate = type === 'exchange' && $('rate').value !== '' ? Number($('rate').value) : '';
    if (type === 'exchange' && rate === '' && (settings.defaultRate === '' || settings.defaultRate == null)) {
      alert('اكتب سعر الصرف أو سعر اليوم'); return;
    }
    const obj = {
      type, amount, rate,
      date: $('date').value || today(),
      details: $('details').value.trim(),
      deducted: type === 'bank' ? false : $('deducted').checked
    };
    if (editingId) {
      db.ref('ledger/' + editingId).update(obj).then(resetForm);
    } else {
      obj.createdAt = firebase.database.ServerValue.TIMESTAMP;
      db.ref('ledger').push(obj).then(resetForm);
    }
  }

  function writeSettings() {
    const s = {
      defaultRate: $('defaultRate').value,
      commFixed: Number($('commFixed').value || 0),
      commPer: Number($('commPer').value || 0),
      commFrom: $('commFrom').value || '2026-09-06'
    };
    db.ref('settings').set(s).then(() => {
      const st = $('saveState');
      st.classList.add('on');
      clearTimeout(st._t);
      st._t = setTimeout(() => st.classList.remove('on'), 1500);
    });
  }

  // ===== data =====
  function renderAll() {
    renderList();
    updatePreview();
  }

  function startData() {
    db.ref('ledger').on('value', snap => {
      const v = snap.val() || {};
      entries = Object.entries(v).map(([id, x]) => ({ id, ...x }));
      $('importBtn').classList.toggle('hidden', entries.length > 0);
      renderNames();
      renderAll();
    });
    db.ref('settings').on('value', snap => {
      settings = { defaultRate: '', commFixed: 4260, commPer: 110, commFrom: '2026-09-06', ...(snap.val() || {}) };
      if (document.activeElement !== $('defaultRate')) $('defaultRate').value = settings.defaultRate ?? '';
      if (document.activeElement !== $('commFixed')) $('commFixed').value = settings.commFixed ?? 4260;
      if (document.activeElement !== $('commPer')) $('commPer').value = settings.commPer ?? 110;
      $('commFrom').value = settings.commFrom || '2026-09-06';
      renderAll();
    });
  }

  function login() {
    $('loginStatus').textContent = 'جاري الدخول...';
    auth.signInWithEmailAndPassword($('email').value.trim(), $('password').value)
      .catch(() => { $('loginStatus').textContent = 'البريد أو كلمة السر غلط'; });
  }

  function importSeed() {
    if (!confirm('هيتم إضافة ' + SEED.length + ' حركة من الإكسل. متعملش ده مرتين. تكمل؟')) return;
    const ref = db.ref('ledger');
    const updates = {};
    SEED.forEach((row, i) => {
      const key = ref.push().key;
      updates[key] = { ...row, createdAt: 1000 + i };
    });
    ref.update(updates).then(() => alert('تم الاستيراد')).catch(err => alert('فشل: ' + err.message));
  }

  function bind() {
    $('type').addEventListener('change', updateFormForType);
    $('amount').addEventListener('input', updatePreview);
    $('rate').addEventListener('input', updatePreview);
    $('saveBtn').addEventListener('click', saveEntry);
    $('cancelBtn').addEventListener('click', resetForm);
    $('search').addEventListener('input', renderList);
    ['defaultRate', 'commFixed', 'commPer', 'commFrom'].forEach(id => $(id).addEventListener('input', writeSettings));
    $('importBtn').addEventListener('click', importSeed);
    $('loginBtn').addEventListener('click', login);
    $('password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
    $('logoutBtn').addEventListener('click', () => auth.signOut());
    $('newBtn').addEventListener('click', () => {
      resetForm();
      $('formCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
      $('amount').focus();
    });
    document.querySelectorAll('[data-type]').forEach(b => b.addEventListener('click', () => {
      $('type').value = b.dataset.type;
      updateFormForType();
    }));
    document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => setFilter(b.dataset.mode)));
  }

  auth.onAuthStateChanged(user => {
    if (user) {
      $('loginCard').classList.add('hidden');
      $('app').classList.remove('hidden');
      $('date').value = today();
      startData();
    } else {
      $('loginCard').classList.remove('hidden');
      $('app').classList.add('hidden');
      $('loginStatus').textContent = '';
    }
  });

  bind();
  updateFormForType();
