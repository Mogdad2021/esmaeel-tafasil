<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تفاصيل التحاويل الخاصه بـ خ اسماعيل - عرض</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root {
    --lime: #C4EE2B;
    --gold: #E8C76A;
    --text: #F3F7EC;
    --muted: #B5C9A0;
    --neg: #F08A7E;
    --card: #14270F;
    --edge: rgba(255,255,255,.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'IBM Plex Sans Arabic', Tahoma, Arial, sans-serif;
    color: var(--text); min-height: 100vh; font-size: 16px;
    background: radial-gradient(120% 90% at 50% 0%, #1E3B17 0%, #0F2009 70%) no-repeat #0F2009;
    -webkit-font-smoothing: antialiased;
    padding: calc(28px + env(safe-area-inset-top, 0px)) 56px calc(40px + env(safe-area-inset-bottom, 0px));
  }
  .num {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums;
    letter-spacing: .01em; display: inline-block;
  }
  .wrap { max-width: 1600px; margin: 0 auto; }
  .hidden { display: none !important; }

  /* header */
  header.top { display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap; margin-bottom: 30px; }
  .brand { display: flex; align-items: center; gap: 18px; min-width: 0; }
  .mark { width: 60px; height: 60px; border-radius: 18px; background: var(--lime); color: #0F2009;
    display: grid; place-items: center; font-size: 30px; font-weight: 700; flex: none; }
  h1 { font-size: 30px; font-weight: 700; margin: 0; }
  .sub { font-size: 18px; color: var(--muted); margin-top: 4px; }
  .clock { text-align: end; }
  .time { font-size: 44px; font-weight: 600; color: var(--text); line-height: 1.1; }
  .date { font-size: 18px; color: var(--muted); margin-top: 4px; }
  .live { font-size: 13px; color: var(--lime); margin-top: 6px; }
  .live.err { color: var(--neg); }

  /* balance cards */
  .balances { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px; }
  .bal { border-radius: 28px; padding: 44px 48px; display: flex; flex-direction: column; gap: 22px; min-width: 0; }
  .bal .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .bal .lbl { font-size: clamp(18px, 1.6vw, 24px); font-weight: 600; }
  .badge { font-size: 18px; font-weight: 700; padding: 6px 12px; border-radius: 10px; letter-spacing: .08em; direction: ltr; unicode-bidi: isolate; }
  .bal .big { font-size: clamp(72px, 9vw, 128px); font-weight: 700; line-height: 1; letter-spacing: -.03em; }
  .bal.sdg { background: linear-gradient(160deg, #C4EE2B, #A9D41E); color: #0F2009; }
  .sdg .lbl { opacity: .85; }
  .sdg .badge { background: rgba(15,32,9,.12); }
  .bal.sar { background: linear-gradient(170deg, #1E3B17, #0F2009); color: var(--text); border: 1px solid rgba(232,199,106,.35); }
  .sar .lbl { color: var(--muted); }
  .sar .big { color: var(--gold); }
  .sar .badge { background: rgba(232,199,106,.16); color: var(--gold); }
  .chips { display: flex; gap: 10px; flex-wrap: wrap; }
  .chip { font-size: 17px; padding: 8px 14px; border-radius: 999px; background: rgba(232,199,106,.14); color: var(--gold); }
  .chip b { font-weight: 700; }

  /* kpis */
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px; }
  .card { background: var(--card); border: 1px solid var(--edge); border-radius: 24px; }
  .kpi { padding: 36px 40px; display: flex; flex-direction: column; gap: 14px; }
  .kpi .lbl { font-size: 20px; color: var(--muted); }
  .kpi .val { font-size: clamp(40px, 4vw, 48px); font-weight: 700; }
  .kpi .val.green { color: var(--lime); }

  /* latest */
  .latest { padding: 30px 40px; }
  .latest-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
  .latest-head h2 { font-size: 26px; font-weight: 700; margin: 0; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; }
  input, select { font: inherit; font-size: 16px; height: 44px; padding: 8px 14px; border-radius: 12px;
    border: 1px solid var(--edge); background: #0F2009; color: var(--text); }
  input { min-width: 200px; }
  input::placeholder { color: var(--muted); opacity: .7; }
  input:focus-visible, select:focus-visible { outline: none; box-shadow: 0 0 0 4px rgba(196,238,43,.45); }
  .item { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 0; border-top: 1px solid var(--edge); }
  .item:first-of-type { border-top: 0; }
  .item .start, .item .end { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .item .end { text-align: end; flex-direction: column; align-items: flex-end; gap: 4px; }
  .kind { font-size: 16px; padding: 4px 12px; border-radius: 999px; background: rgba(196,238,43,.14); color: var(--lime); white-space: nowrap; }
  .kind.transfer { background: rgba(232,199,106,.14); color: var(--gold); }
  .kind.bank { background: rgba(196,238,43,.14); color: var(--lime); }
  .desc { font-size: 22px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .when { font-size: 22px; color: var(--muted); }
  .amt { font-size: 26px; font-weight: 600; }
  .tag-ded { font-size: 14px; color: var(--gold); }
  .note { font-size: 16px; color: var(--muted); padding: 10px 0 0; }
  .empty { text-align: center; color: var(--muted); padding: 30px 0; font-size: 18px; }

  /* ===== transaction detail cards ===== */
  .item { display: flex; flex-direction: column; align-items: stretch; gap: 14px; padding: 22px 0; }
  .item-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .item-head .start { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-width: 0; }
  .party { font-size: 20px; color: var(--text); overflow-wrap: anywhere; }
  .party .lab { color: var(--muted); font-size: 14px; margin-inline-end: 8px; }
  .end-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .status { font-size: 14px; padding: 4px 12px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
  .status.ok { background: rgba(196,238,43,.14); color: var(--lime); }
  .status.warn { background: rgba(232,199,106,.16); color: var(--gold); }
  .calc { background: rgba(255,255,255,.035); border: 1px solid var(--edge); border-radius: 16px;
    padding: 14px 20px; display: grid; gap: 10px; }
  .cl { display: grid; grid-template-columns: 28px 1fr; align-items: center; gap: 10px; font-size: 20px; }
  .cl .sym { color: var(--muted); font-weight: 700; text-align: center; font-size: 22px; }
  .cl .content { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0; }
  .cl .v { font-size: 26px; font-weight: 700; }
  .cl .v.sar { color: var(--gold); }
  .cl .v.sdg { color: var(--lime); }
  .cl .v.mid { color: var(--text); font-size: 22px; }
  .cl .u { color: var(--muted); font-size: 18px; }
  .cl.res { border-top: 1px dashed var(--edge); padding-top: 12px; margin-top: 2px; }
  .cl.res .u { color: var(--text); font-weight: 600; }
  .calc .note { font-size: 15px; color: var(--muted); padding-inline-start: 38px; }
  .calc .hint { font-size: 14px; color: var(--muted); padding-inline-start: 38px; margin-top: -4px; }
  @media (max-width: 900px) {
    .item { gap: 12px; padding: 16px 0; align-items: stretch; }
    .party { font-size: 15px; }
    .party .lab { font-size: 12px; }
    .status { font-size: 12px; padding: 3px 10px; }
    .calc { padding: 12px 14px; gap: 8px; border-radius: 14px; }
    .cl { grid-template-columns: 22px 1fr; gap: 8px; font-size: 15px; }
    .cl .sym { font-size: 17px; }
    .cl .v { font-size: 20px; }
    .cl .v.mid { font-size: 17px; }
    .cl .u { font-size: 14px; }
    .calc .note, .calc .hint { font-size: 12px; padding-inline-start: 30px; }
  }

  /* ===== per-type layout ===== */
  .details { font-size: 20px; color: var(--text); line-height: 1.5; overflow-wrap: anywhere; }
  .big-amt { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .big-amt .v { font-size: clamp(40px, 4.4vw, 56px); font-weight: 700; line-height: 1.05; }
  .big-amt .v.sar { color: var(--gold); }
  .big-amt .v.sdg { color: var(--lime); }
  .big-amt .u { font-size: 20px; color: var(--muted); }
  .cl.res .v.sdg { font-size: clamp(30px, 3.2vw, 40px); }
  .cl.res .u { font-size: 20px; }
  .amt-box { background: rgba(255,255,255,.035); border: 1px solid var(--edge); border-radius: 16px;
    padding: 16px 20px; display: grid; gap: 10px; }
  @media (max-width: 900px) {
    .details { font-size: 16px; }
    .big-amt .v { font-size: 38px; }
    .big-amt .u { font-size: 15px; }
    .cl.res .v.sdg { font-size: 28px; }
    .cl.res .u { font-size: 15px; }
    .amt-box { padding: 12px 14px; gap: 8px; border-radius: 14px; }
  }

  /* loading skeleton */
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  body.loading .num {
    color: transparent !important; min-width: 180px; border-radius: 10px;
    background: linear-gradient(90deg, rgba(255,255,255,.05) 25%, rgba(255,255,255,.14) 50%, rgba(255,255,255,.05) 75%) 0 0 / 200% 100%;
    animation: shimmer 1.4s linear infinite;
  }
  body.loading .sdg .num { background: linear-gradient(90deg, rgba(15,32,9,.08) 25%, rgba(15,32,9,.2) 50%, rgba(15,32,9,.08) 75%) 0 0 / 200% 100%; }

  /* flash on change */
  @keyframes fGood { from { background-color: rgba(196,238,43,.22); } to { background-color: var(--base); } }
  @keyframes fBad  { from { background-color: rgba(240,138,126,.22); } to { background-color: var(--base); } }
  .flash-good { animation: fGood 1.1s ease-out; }
  .flash-bad  { animation: fBad 1.1s ease-out; }
  .bal { --base: #14270F; }
  .sdg { --base: #C4EE2B; }
  .sar { --base: #14270F; }
  .kpi { --base: #14270F; }

  /* responsive: mobile */
  @media (max-width: 900px) {
    body { padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
    .mark { width: 38px; height: 38px; font-size: 18px; border-radius: 12px; }
    h1 { font-size: 16px; }
    .sub { font-size: 12px; }
    .clock { order: -1; width: 100%; display: flex; justify-content: space-between; align-items: baseline; }
    .time { font-size: 16px; font-weight: 600; }
    .date { font-size: 12px; margin-top: 0; }
    .live { margin-top: 0; font-size: 11px; }
    header.top { margin-bottom: 18px; }
    .balances { grid-template-columns: 1fr; gap: 14px; margin-bottom: 14px; }
    .bal { border-radius: 22px; padding: 22px; gap: 14px; }
    .bal .lbl { font-size: 15px; font-weight: 600; }
    .badge { font-size: 13px; }
    .bal .big { font-size: 56px; line-height: 1.05; }
    .chip { font-size: 12px; padding: 5px 10px; }
    .kpis { grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .card { border-radius: 16px; }
    .kpi { padding: 16px; gap: 8px; }
    .kpi .lbl { font-size: 13px; }
    .kpi .val { font-size: 18px; }
    .latest { padding: 18px; }
    .latest-head h2 { font-size: 16px; }
    .controls { width: 100%; }
    input { min-width: 0; flex: 1 1 100%; font-size: 16px; }
    select { flex: 1 1 100%; }
    .item { padding: 12px 0; }
    .kind { font-size: 12px; padding: 3px 9px; }
    .desc { font-size: 14px; }
    .when { font-size: 11px; }
    .amt { font-size: 15px; }
    .tag-ded { font-size: 11px; }
    .note { font-size: 12px; }
    .empty { font-size: 14px; }
    .item .start { min-width: 0; }
  }
  @media (max-width: 899px) and (min-width: 0px) {
    .item { align-items: stretch; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body class="loading">
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark">ت</div>
      <div>
        <h1>تفاصيل التحاويل</h1>
        <div class="sub">خ إسماعيل - إدارة الصرافة</div>
      </div>
    </div>
    <div class="clock">
      <div class="time num" id="clockTime">--:--</div>
      <div class="date" id="clockDate"></div>
      <div class="live" id="live">جاري التحميل...</div>
    </div>
  </header>

  <section class="balances">
    <div class="card bal sdg" data-flash="1">
      <div class="row">
        <span class="lbl">الرصيد المتبقي - الجنيه السوداني</span>
        <span class="badge">SDG</span>
      </div>
      <div class="big num" id="kRemSdg">0</div>
    </div>
    <div class="card bal sar" data-flash="1">
      <div class="row">
        <span class="lbl">الرصيد المتبقي - الريال السعودي</span>
        <span class="badge">SAR</span>
      </div>
      <div class="big num" id="kRemSar">0</div>
      <div class="chips">
        <span class="chip">إجمالي الريال: <b class="num" id="kTotalSar">0</b></span>
        <span class="chip">تحويلات الريال: <b class="num" id="kSarTr">0</b></span>
      </div>
    </div>
  </section>

  <section class="kpis">
    <div class="card kpi" data-flash="1">
      <div class="lbl">إجمالي السوداني (صرف)</div>
      <div class="val green num" id="kTotalSdg">0</div>
    </div>
    <div class="card kpi" data-flash="1">
      <div class="lbl">تحويلات بنكك</div>
      <div class="val green num" id="kBank">0</div>
    </div>
  </section>

  <section class="card latest">
    <div class="latest-head">
      <h2>آخر الحركات</h2>
      <div class="controls">
        <input type="text" id="search" placeholder="بحث بالتفاصيل أو المبلغ" aria-label="بحث">
        <select id="filterType" aria-label="نوع الحركة">
          <option value="all">الكل</option>
          <option value="exchange">صرف</option>
          <option value="sarTransfer">تحويل ريال</option>
          <option value="bank">تحويل بنكك</option>
        </select>
      </div>
    </div>
    <div id="list"></div>
    <div class="note" id="listNote"></div>
  </section>
</div>

<script>
// ===== Firebase config (project: esmaeel-tafasi) =====
const firebaseConfig = {
  apiKey: "AIzaSyDo2GSZeKlXesoNCCpcDkpv_Ct_igPuN5M",
  authDomain: "esmaeel-tafasi.firebaseapp.com",
  databaseURL: "https://esmaeel-tafasi-default-rtdb.firebaseio.com",
  projectId: "esmaeel-tafasi",
  storageBucket: "esmaeel-tafasi.firebasestorage.app",
  messagingSenderId: "600912220481",
  appId: "1:600912220481:web:3626a362de34b006ced1c0"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

(function () {
  let entries = [];
  let settings = { defaultRate: '', commFixed: 4260, commPer: 110, commFrom: '2026-09-06' };
  let ledgerLoaded = false, settingsLoaded = false;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const LATEST_COUNT = 5;

  const $ = (id) => document.getElementById(id);
  const fmt = (n) => Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 });
  const typeLabel = (t) => t === 'exchange' ? 'صرف' : t === 'sarTransfer' ? 'تحويل ريال' : 'تحويل بنكك';
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };

  // ===== formulas (unchanged from the original system) =====
  function effectiveRate(e) {
    if (e.rate !== '' && e.rate != null) return Number(e.rate);
    if (settings.defaultRate !== '' && settings.defaultRate != null) return Number(settings.defaultRate);
    return null;
  }
  function sdgOf(e) {
    const r = effectiveRate(e);
    return (e.type !== 'exchange' || r == null) ? null : Number(e.amount) * r;
  }
  function computeTotals() {
    const ex = entries.filter(e => e.type === 'exchange');
    const sarTr = entries.filter(e => e.type === 'sarTransfer');
    const bank = entries.filter(e => e.type === 'bank');
    const totalSar = ex.reduce((s, e) => s + Number(e.amount || 0), 0);
    const totalSdg = ex.reduce((s, e) => s + (sdgOf(e) || 0), 0);
    const bankTotal = bank.reduce((s, e) => s + Number(e.amount || 0), 0);
    const sarTrTotal = sarTr.reduce((s, e) => s + Number(e.amount || 0), 0);
    const sarTrDed = sarTr.filter(e => e.deducted).reduce((s, e) => s + Number(e.amount || 0), 0);
    const cnt = ex.filter(e => (e.date || '') >= (settings.commFrom || '0000-00-00')).length;
    const comm = Number(settings.commFixed || 0) + cnt * Number(settings.commPer || 0);
    return {
      totalSar, totalSdg, bankTotal, sarTrTotal, comm,
      remSar: totalSar - sarTrDed,
      remSdg: bankTotal - totalSdg - comm
    };
  }

  // ===== animation (display only) =====
  function animate(node, from, to, dur, delay) {
    cancelAnimationFrame(node._raf);
    if (reduceMotion.matches || dur <= 0) { node.textContent = fmt(to); return; }
    const start = performance.now() + (delay || 0);
    const step = (now) => {
      const t = Math.min(1, Math.max(0, (now - start) / dur));
      const k = 1 - Math.pow(1 - t, 3);
      node.textContent = t >= 1 ? fmt(to) : fmt(from + (to - from) * k);
      if (t < 1) node._raf = requestAnimationFrame(step);
    };
    node.textContent = fmt(from);
    node._raf = requestAnimationFrame(step);
  }
  function flash(node, good) {
    const card = node.closest('[data-flash]');
    if (!card || reduceMotion.matches) return;
    card.classList.remove('flash-good', 'flash-bad');
    void card.offsetWidth;
    card.classList.add(good ? 'flash-good' : 'flash-bad');
    clearTimeout(card._ft);
    card._ft = setTimeout(() => card.classList.remove('flash-good', 'flash-bad'), 1200);
  }
  const NUM_IDS = ['kRemSdg', 'kRemSar', 'kTotalSar', 'kSarTr', 'kTotalSdg', 'kBank'];
  function setNum(id, value, index) {
    const node = $(id);
    if (!node) return;
    const to = Number(value) || 0;
    if (node._cur === undefined) {
      node._cur = to;
      animate(node, 0, to, 1000, (index || 0) * 80);
      return;
    }
    if (node._cur === to) return;
    const from = node._cur;
    node._cur = to;
    flash(node, to > from);
    animate(node, from, to, 900, 0);
  }

  function renderKpis() {
    if (!(ledgerLoaded && settingsLoaded)) return;
    const t = computeTotals();
    setNum('kRemSdg', t.remSdg, 0);
    setNum('kRemSar', t.remSar, 1);
    setNum('kTotalSar', t.totalSar, 2);
    setNum('kSarTr', t.sarTrTotal, 3);
    setNum('kTotalSdg', t.totalSdg, 4);
    setNum('kBank', t.bankTotal, 5);
  }

  // ===== latest transactions (rate and commission are not shown here) =====
  const vEl = (text, cls) => el('span', 'v num ' + (cls || ''), text);
  const uEl = (text) => el('span', 'u', text);
  function calcLine(cls, sym, parts) {
    const row = el('div', 'cl ' + (cls || ''));
    row.appendChild(el('span', 'sym', sym || ''));
    const content = el('div', 'content');
    parts.forEach(p => content.appendChild(p));
    row.appendChild(content);
    return row;
  }

  // body of one card, by type. Only fields stored on the entry are used.
  function buildBody(e) {
    if (e.type === 'sarTransfer') {
      // details sit directly above the big riyal amount
      const wrap = el('div', 'big-amt');
      wrap.append(vEl(fmt(e.amount), 'sar'), uEl('ريال سعودي'));
      return wrap;
    }
    if (e.type === 'bank') {
      // bank transfer: amount only
      const wrap = el('div', 'big-amt');
      wrap.append(vEl(fmt(e.amount), 'sdg'), uEl('جنيه سوداني'));
      return wrap;
    }
    // exchange: amount x rate = result
    const box = el('div', 'amt-box');
    const s = sdgOf(e);
    box.appendChild(calcLine('', '', [vEl(fmt(e.amount), 'sar'), uEl('ريال سعودي')]));
    if (e.rate !== '' && e.rate != null) {
      box.appendChild(calcLine('mid', '×', [uEl('سعر التحويل'), vEl(fmt(e.rate), 'mid')]));
    } else {
      box.appendChild(calcLine('mid', '×', [uEl('بسعر اليوم')]));
    }
    box.appendChild(calcLine('res', '=', [vEl(s == null ? '—' : fmt(s), 'sdg'), uEl('جنيه سوداني')]));
    return box;
  }

  function renderList() {
    const q = $('search').value.trim().toLowerCase();
    const ft = $('filterType').value;
    const list = $('list');
    const note = $('listNote');
    list.textContent = '';
    const all = entries
      .filter(e => ft === 'all' || e.type === ft)
      .filter(e => !q || (e.details || '').toLowerCase().includes(q) || String(e.amount).includes(q))
      .sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || 0) - (a.createdAt || 0));
    const filtering = !!q || ft !== 'all';
    const items = filtering ? all : all.slice(0, LATEST_COUNT);
    note.textContent = filtering
      ? ('النتائج: ' + fmt(all.length))
      : (all.length > LATEST_COUNT ? 'تعرض آخر ' + LATEST_COUNT + ' حركات - استخدم البحث أو الفلترة لعرض الكل' : '');

    if (!items.length) {
      list.appendChild(el('div', 'empty', 'لا توجد حركات'));
      return;
    }
    for (const e of items) {
      const card = el('div', 'item');

      // top row: type, status, date
      const head = el('div', 'item-head');
      head.appendChild(el('span', 'kind' + (e.type === 'sarTransfer' ? ' transfer' : e.type === 'bank' ? ' bank' : ''), typeLabel(e.type)));
      const endMeta = el('div', 'end-meta');
      endMeta.appendChild(el('span', 'when num', e.date || ''));
      endMeta.appendChild(el('span', 'status ' + (e.deducted ? 'warn' : 'ok'), e.deducted ? 'مخصوم' : 'مكتمل'));
      head.appendChild(endMeta);
      card.appendChild(head);

      // details (bank transfers show no party or extra details)
      if (e.type !== 'bank' && e.details) {
        card.appendChild(el('div', 'details', e.details));
      }

      card.appendChild(buildBody(e));
      list.appendChild(card);
    }
  }

  // ===== clock =====
  function updateClock() {
    const now = new Date();
    $('clockTime').textContent = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false }).format(now);
    $('clockDate').textContent = new Intl.DateTimeFormat('ar-EG', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(now);
  }
  function scheduleClock() {
    updateClock();
    const ms = 60000 - (Date.now() % 60000) + 50;
    setTimeout(() => { updateClock(); setInterval(updateClock, 60000); }, ms);
  }

  // ===== data =====
  function onLoaded() {
    if (ledgerLoaded && settingsLoaded) {
      document.body.classList.remove('loading');
      $('live').textContent = 'محدّث لحظياً';
      $('live').classList.remove('err');
    }
  }
  function start() {
    db.ref('ledger').on('value', snap => {
      const v = snap.val() || {};
      entries = Object.entries(v).map(([id, x]) => ({ id, ...x }));
      ledgerLoaded = true;
      renderKpis();
      renderList();
      onLoaded();
    }, err => {
      $('live').classList.add('err');
      $('live').textContent = 'تعذر التحميل: ' + err.message;
    });
    db.ref('settings').on('value', snap => {
      settings = { defaultRate: '', commFixed: 4260, commPer: 110, commFrom: '2026-09-06', ...(snap.val() || {}) };
      settingsLoaded = true;
      renderKpis();
      renderList();
      onLoaded();
    });
    $('search').addEventListener('input', renderList);
    $('filterType').addEventListener('change', renderList);
    scheduleClock();
  }

  start();
})();
</script>
</body>
</html>
